[package]
name = "charaoke"
version = "0.3.0"
edition = "2024"
readme = "README.md"
description = "Fast image-to-ASCII conversion, built for live terminal rendering."
keywords = [ "ascii", "ascii-art", "image", "terminal" ]
categories = [ "multimedia::images", "command-line-interface" ]
repository = "https://github.com/dylan-stark/acres"
authors = [ "Dylan Stark <dylan.stark@gmail.com>" ]
license = "MIT OR Apache-2.0"

[dependencies]

[dev-dependencies]
# Same version as acres-tui, for the ANSI round-trip test and bench.
ansi-to-tui = "7.0.0"
criterion = "0.8.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
# Same version as acres-tui, for the headless resize bench.
ratatui = "0.29.0"

[[bench]]
name = "stages"
harness = false

[[bench]]
name = "tui_proxy"
harness = false
