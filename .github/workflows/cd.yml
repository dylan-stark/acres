name: CD # Continuous Deployment

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  publish:

    name: Publishing for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-name: linux
            target: x86_64-unknown-linux-gnu
            architecture: x86_64
            binary-postfix: ""
          - os: ubuntu-24.04-arm
            os-name: linux
            target: aarch64-unknown-linux-gnu
            architecture: arm64
            binary-postfix: ""
          - os: macos-latest
            os-name: macos
            target: aarch64-apple-darwin
            architecture: arm64
            binary-postfix: ""
          - os: windows-latest
            os-name: windows
            target: x86_64-pc-windows-msvc
            architecture: x86_64
            binary-postfix: ".exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # Debug symbols are stripped by `strip = true` in the workspace's release profile.
      - name: Cargo build
        run: cargo build --release --locked --target ${{ matrix.target }} -p acres-cli -p acres-tui
      - name: Packaging final binaries
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release

          for BIN in acres-cli acres-tui; do
            BINARY_NAME=$BIN${{ matrix.binary-postfix }}
            RELEASE_NAME=$BIN-${GITHUB_REF_NAME}-${{ matrix.os-name }}-${{ matrix.architecture }}
            tar czvf $RELEASE_NAME.tar.gz $BINARY_NAME

            if [[ ${{ runner.os }} == 'Windows' ]]; then
              certutil -hashfile $RELEASE_NAME.tar.gz sha256 | grep -E [A-Fa-f0-9]{64} > $RELEASE_NAME.sha256
            else
              shasum -a 256 $RELEASE_NAME.tar.gz > $RELEASE_NAME.sha256
            fi
          done
      - name: Releasing assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/acres-cli-*.tar.gz
            target/${{ matrix.target }}/release/acres-cli-*.sha256
            target/${{ matrix.target }}/release/acres-tui-*.tar.gz
            target/${{ matrix.target }}/release/acres-tui-*.sha256
