name: Claude review

# Optional: runs only when the ANTHROPIC_API_KEY repository secret is set.
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    name: Claude Code review
    runs-on: ubuntu-latest
    if: ${{ vars.CLAUDE_REVIEW == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request against the conventions in CLAUDE.md
            (changelog, ADRs, snapshots, network-mocked tests, dependency direction).
            Comment only on concrete problems.
