[package]
name = "image-to-ascii-builder"
version = "0.3.0"
edition = "2024"
readme = "README.md"
description = "Builder for working with the image-to-ascii crate."
keywords = [ "ascii", "ascii-art", "image" ]
categories = [ "multimedia::images" ]
repository = "https://github.com/dylan-stark/acres"
authors = [ "Dylan Stark <dylan.stark@gmail.com>" ]
license = "MIT OR Apache-2.0"
# Kept only as the benchmark baseline for charaoke (ADR 0011), so not published.
publish = false

[dependencies]
anyhow = "1.0.100"
bytes = "1.10.1"
# indicatif is pinned here to match image-to-ascii
indicatif = "0.18.0"
# image is pinned here to match image-to-ascii
image = "0.24.2"
image-to-ascii = "0.7.0"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.17"
tracing = "0.1.41"

[dev-dependencies]
# Same version as acres-tui, to measure its parse of the colored string.
ansi-to-tui = "7.0.0"
criterion = "0.8.2"

[[bench]]
name = "baseline"
harness = false
